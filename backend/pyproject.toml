[project]
name = "plant-backend"
version = "0.5.0"
description = "Plant-control backend: owns the simulation loop, the controller and the action guard."
requires-python = ">=3.11"
dependencies = [
    "plant-sim",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
plant-sim = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plant_backend"]
